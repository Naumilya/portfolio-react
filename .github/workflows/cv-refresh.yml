name: Refresh CV

on:
  push:
    branches: [main]
    paths:
      - '.github/cv/generate_cv.py'
      - '.github/workflows/cv-refresh.yml'

permissions:
  contents: write

jobs:
  refresh:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install PDF tools
        run: pip install reportlab==4.4.3 pypdf==5.9.0

      - name: Generate CV
        run: python .github/cv/generate_cv.py

      - name: Verify CV
        run: |
          python - <<'PY'
          from pathlib import Path
          from pypdf import PdfReader

          path = Path('public/assets/ilya-naumov-cv.pdf')
          assert path.stat().st_size > 20_000
          text = '\n'.join(page.extract_text() or '' for page in PdfReader(path).pages)
          assert 'Московский технологический институт (МТИ), Москва' in text
          assert '27.03.04' in text
          assert 'Системы и средства автоматизации технологических процессов' in text
          print(f'CV verified: {path.stat().st_size} bytes')
          PY

      - name: Commit CV
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add public/assets/ilya-naumov-cv.pdf
          if git diff --cached --quiet; then
            echo 'CV is already up to date'
            exit 0
          fi
          git commit -m '(fix): update CV with MTI education'
          git push
